name: Update GitHub Trending

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-trending.yml"
      - "github-trending-source/*.py"
      - "github-trending-source/run_daily.sh"
      - "github-trending-source/requirements.txt"
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * *"

permissions:
  contents: write

concurrency:
  group: update-github-trending
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      INSIGHT_MAX_TOKENS: "300"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r github-trending-source/requirements.txt

      - name: Run daily update
        run: bash github-trending-source/run_daily.sh

      - name: Commit updated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html github-trending-source/data.json github-trending-source/insights.json github-trending-source/seen_repos.json github-trending-source/github_trending.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: 自动更新 GitHub Trending $(date -u +%F)"
          git push
